name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # compileSdk 37 resolves to the android-37.0 platform package, and the SDK now
  # carries minor versions, so "platforms;android-37" would not resolve.
  SDK_PACKAGES: "platforms;android-37.0 build-tools;37.0.0"

jobs:
  check:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # shellcheck disable=SC2086
          "$sdkmanager" $SDK_PACKAGES

      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cursoid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screens
          path: |
            app/build/screenshots/*.png
            app/build/play/*.png
          if-no-files-found: ignore

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::A tagged release needs the signing secrets. See docs/ci-signing.md." >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # shellcheck disable=SC2086
          "$sdkmanager" $SDK_PACKAGES

      # The secrets context is not dependable inside a step-level `if`, so the
      # presence of a Play upload key becomes a step output instead.
      - name: Decode keystores
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.p12"
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "has_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK
        env:
          CURSOID_KEYSTORE: ${{ runner.temp }}/sideload.p12
          CURSOID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          CURSOID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          CURSOID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Build Play bundle
        if: steps.keys.outputs.has_upload == 'true'
        env:
          CURSOID_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.p12
          CURSOID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          CURSOID_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          CURSOID_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease -PplayUpload

      - name: Collect artifacts
        id: collect
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/cursoid-$version.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "out/cursoid-$version.aab"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          {
            echo "Sideload the APK by opening this page on the phone and tapping it,"
            echo "or install over USB from a clone:"
            echo
            echo '```'
            echo "./scripts/install-on-phone.sh"
            echo '```'
            echo
            echo "Requires Android 8.0 (API 26) or newer. The APK is self-signed, so"
            echo "Android will warn about an unknown developer."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Cursoid $VERSION" \
            --notes-file notes.md \
            out/*
